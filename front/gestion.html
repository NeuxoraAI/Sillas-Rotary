    <script src="assets/js/validations.js"></script>
    <script data-purpose="form-logic">
      const COMO_OBTUVO_SILLA_CATALOG = ["COMPRA", "DONACION"];

      function setCatalogSelectValue(name, val, catalog) {
        const el = document.querySelector(`[name="${name}"]`);
        if (!el || val == null) return;
        el.value = catalog.includes(val) ? val : "";
      }

      // -- Validación preventiva para entidad_solicitante -----------------
      function _setupEntidadValidation() {
        const input = document.querySelector('[name="entidad_solicitante"]');
        if (!input) return;
        SR_Validations.setupWhitelistField(
          input,
          SR_Validations.ENTIDAD_WHITELIST_RE,
          SR_Validations.LIMITS.ENTIDAD_MAX
        );
      }

      // -- Validación preventiva para justificacion (misma que observaciones_posturales)
      function _setupJustificacionValidation() {
        const textarea = document.querySelector('[name="justificacion"]');
        if (!textarea) return;
        SR_Validations.setupWhitelistField(
          textarea,
          SR_Validations.OBS_WHITELIST_RE,
          SR_Validations.LIMITS.JUST_MAX
        );
      }

      // -- setupSillaPreviaConditionalField ---------------------------------
      function setupSillaPreviaConditionalField() {
        const sillaPrevia = document.querySelector('[name="silla_previa"]');
        const comoObtuvo = document.querySelector('[name="como_obtuvo_silla"]');
        if (!sillaPrevia || !comoObtuvo) return;

        const apply = () => {
          const hasPreviousChair = sillaPrevia.value === "Sí";
          SR_Validations.setFieldDisabled(comoObtuvo, !hasPreviousChair);
          comoObtuvo.required = hasPreviousChair;
          if (!hasPreviousChair) {
            SR_Validations.setFieldDisabled(comoObtuvo, true);
            comoObtuvo.required = false;
            comoObtuvo.selectedIndex = 0;
            SR_Validations.clearFieldError("como_obtuvo_silla");
          }
        };

        sillaPrevia.addEventListener("change", apply);
        apply();
      }

      // -- setupJustificacionConditional ------------------------------------
      function setupJustificacionConditional() {
        const checkbox = document.querySelector('[name="tiene_justificacion"]');
        const textarea = document.querySelector('[name="justificacion"]');
        if (!checkbox || !textarea) return;

        const apply = () => {
          if (checkbox.checked) {
            SR_Validations.setFieldDisabled(textarea, false);
            textarea.required = true;
          } else {
            SR_Validations.setFieldDisabled(textarea, true);
            textarea.required = false;
            textarea.value = "";
            SR_Validations.clearFieldError("justificacion");
          }
        };

        checkbox.addEventListener("change", apply);
        apply();
      }

      // -- Toast de éxito ---------------------------------------------------
      function showSuccessToast(message, redirectUrl) {
        const toast = document.getElementById("success-toast");
        const msgEl = document.getElementById("success-toast-msg");
        if (!toast || !msgEl) {
          if (redirectUrl) setTimeout(() => (window.location.href = redirectUrl), 2000);
          return;
        }
        msgEl.textContent = message;
        toast.classList.remove("hidden", "hiding");
        setTimeout(() => {
          toast.classList.add("hiding");
          setTimeout(() => {
            toast.classList.add("hidden");
            toast.classList.remove("hiding");
            if (redirectUrl) window.location.href = redirectUrl;
          }, 300);
        }, 1800);
      }

      // -- submitGestion ----------------------------------------------------
      async function submitGestion(status) {
        const errorEl = document.getElementById("error-msg");
        errorEl.classList.add("hidden");
        errorEl.textContent = "";

        const session = JSON.parse(localStorage.getItem("session") || "null");
        if (!session?.token) {
          window.location.href = "login.html";
          return;
        }

        const estudioId = localStorage.getItem("estudio_id");
        const solicitudId = localStorage.getItem("solicitud_id");

        if (!estudioId || !solicitudId) {
          errorEl.textContent =
            "No se encontró el estudio o la solicitud. Complete los pasos anteriores.";
          errorEl.classList.remove("hidden");
          return;
        }

        const f = document.querySelector("form");
        SR_Validations.clearAllFieldErrors(f);

        const fd = new FormData(f);
        const get = (name) => fd.get(name) || "";

        // Payload estudio: 6 campos
        const fechaEstudio = get("fecha_estudio").trim();
        const estudioPayload = {
          tuvo_silla_previa: get("silla_previa") === "Sí",
          como_obtuvo_silla: get("como_obtuvo_silla") || null,
          fecha_estudio: fechaEstudio || null,
          status,
        };

        // Payload solicitud: solo campos de gestión (status ya se guardó en tecnica.html)
        const solicitudPayload = {
          entidad_solicitante: get("entidad_solicitante") || null,
          prioridad: get("prioridad") || null,
          justificacion: get("justificacion") || null,
        };

        // Frontend validation before sending
        if (status === "completo") {
          const missing = [];

          if (!get("silla_previa")) {
            missing.push({ id: "silla_previa", label: "¿El paciente ha tenido silla previamente?" });
          }
          if (get("silla_previa") === "Sí" && !get("como_obtuvo_silla")) {
            missing.push({ id: "como_obtuvo_silla", label: "¿Cómo la obtuvo?" });
          }
          if (!fechaEstudio) {
            missing.push({ id: "fecha_estudio", label: "Fecha del estudio" });
          }
          if (!get("entidad_solicitante")?.trim()) {
            missing.push({ id: "entidad_solicitante", label: "Entidad Solicitante" });
          }
          if (!document.querySelector('[name="prioridad"]:checked')) {
            missing.push({ id: "prioridad", label: "Prioridad" });
          }

          if (missing.length > 0) {
            missing.forEach(({ id, label }) => {
              SR_Validations.showFieldError(id, `${label} es obligatorio`);
            });
            errorEl.textContent = "Complete los campos obligatorios: " + missing.map(m => m.label).join(", ");
            errorEl.classList.remove("hidden");
            return;
          }

          // Validate justificacion if checkbox is checked
          const tieneJust = f.querySelector('[name="tiene_justificacion"]');
          if (tieneJust?.checked) {
            const justVal = (f.querySelector('[name="justificacion"]')?.value || "").trim();
            if (!justVal) {
              SR_Validations.showFieldError("justificacion", "Justificación es obligatorio");
              errorEl.textContent = "Complete los campos obligatorios";
              errorEl.classList.remove("hidden");
              return;
            }
          }
        }

        // Validar constraints HTML5 (minlength, pattern) replicando validación nativa desactivada por novalidate
        if (status === "completo") {
          const constraintErrors = SR_Validations.validateHTML5Constraints(f);
          if (constraintErrors.length > 0) {
            constraintErrors.forEach(({ id, message }) => {
              SR_Validations.showFieldError(id, message);
            });
            errorEl.textContent = "Revise los campos con formato incorrecto";
            errorEl.classList.remove("hidden");
            return;
          }
        }

        try {
          const [estudioRes, solicitudRes] = await Promise.all([
            fetch(`/api/estudios/${estudioId}`, {
              method: "PATCH",
              headers: {
                "Content-Type": "application/json",
                Authorization: "Bearer " + session.token,
              },
              body: JSON.stringify(estudioPayload),
            }),
            fetch(`/api/solicitudes/${solicitudId}`, {
              method: "PATCH",
              headers: {
                "Content-Type": "application/json",
                Authorization: "Bearer " + session.token,
              },
              body: JSON.stringify(solicitudPayload),
            }),
          ]);

          let estudioErr = null;
          let solicitudErr = null;

          if (!estudioRes.ok) {
            const errData = await estudioRes.json().catch(() => ({}));
            estudioErr = SR_Validations.formatBackendError(errData, "Error al actualizar el estudio.");
          }

          if (!solicitudRes.ok) {
            const errData = await solicitudRes.json().catch(() => ({}));
            solicitudErr = SR_Validations.formatBackendError(errData, "Error al actualizar la solicitud.");
          }

          if (estudioErr || solicitudErr) {
            errorEl.textContent = [estudioErr, solicitudErr].filter(Boolean).join(" | ");
            errorEl.classList.remove("hidden");
            return;
          }

          // Ambos exitosos
          if (status === "completo") {
            localStorage.removeItem("estudio_id");
            localStorage.removeItem("solicitud_id");
            localStorage.removeItem("beneficiario_id");
            showSuccessToast("Estudio guardado correctamente", "socioeconomico.html");
          } else {
            showSuccessToast("Borrador guardado correctamente", null);
          }
        } catch (err) {
          errorEl.textContent = "No se pudo conectar con el servidor.";
          errorEl.classList.remove("hidden");
        }
      }

      // -- Auth guard + Prefill + Draft Resume ------------------------------
      (async function () {
        const session = JSON.parse(localStorage.getItem("session") || "null");
        const regionCtx = JSON.parse(
          localStorage.getItem("region_ctx") || "null",
        );
        if (!session?.token || !regionCtx?.region_id) {
          window.location.href = "login.html";
          return;
        }

        // Prefill de campos readonly
        const elaboroEl = document.querySelector('[name="elaboro_estudio"]');
        if (elaboroEl) elaboroEl.value = session.nombre || "";
        const sedeEl = document.querySelector('[name="sede"]');
        if (sedeEl) sedeEl.value = regionCtx.sede || "";
        const ciudadRegEl = document.querySelector('[name="ciudad_registro"]');
        if (ciudadRegEl) ciudadRegEl.value = regionCtx.region_nombre || "";

        // Draft Resume: Estudio
        const estudioId = localStorage.getItem("estudio_id");
        if (estudioId) {
          try {
            const res = await fetch(`/api/estudios/${estudioId}`, {
              headers: {
                Accept: "application/json",
                Authorization: "Bearer " + session.token,
              },
            });

            if (res.ok) {
              const data = await res.json();

              const setVal = (name, val) => {
                const el = document.querySelector(`[name="${name}"]`);
                if (el && val != null) el.value = val;
              };

              setVal(
                "silla_previa",
                data.tuvo_silla_previa === 1 ? "Sí" : "No",
              );
              setCatalogSelectValue("como_obtuvo_silla", data.como_obtuvo_silla, COMO_OBTUVO_SILLA_CATALOG);
              document.querySelector('[name="silla_previa"]')?.dispatchEvent(new Event("change"));
              setVal("sede", data.sede || regionCtx.sede);
              setVal("ciudad_registro", data.ciudad_registro || regionCtx.region_nombre);
            } else if (res.status === 404) {
              localStorage.removeItem("estudio_id");
            }
          } catch (err) {
            console.error("Error loading estudio draft:", err);
          }
        }

        // Draft Resume: Solicitud
        const solicitudId = localStorage.getItem("solicitud_id");
        if (solicitudId) {
          try {
            const res = await fetch(`/api/solicitudes/${solicitudId}`, {
              headers: {
                Accept: "application/json",
                Authorization: "Bearer " + session.token,
              },
            });

            if (res.ok) {
              const data = await res.json();

              const setVal = (name, val) => {
                const el = document.querySelector(`[name="${name}"]`);
                if (el && val != null) el.value = val;
              };

              setVal("entidad_solicitante", data.entidad_solicitante);
              setVal("justificacion", data.justificacion);

              if (data.justificacion && data.justificacion.trim()) {
                const chk = document.querySelector('[name="tiene_justificacion"]');
                if (chk) {
                  chk.checked = true;
                  chk.dispatchEvent(new Event("change"));
                }
              }

              if (data.prioridad) {
                const prioridadRadio = document.querySelector(
                  `[name="prioridad"][value="${data.prioridad}"]`,
                );
                if (prioridadRadio) prioridadRadio.checked = true;
              }
            } else if (res.status === 404) {
              localStorage.removeItem("solicitud_id");
            }
          } catch (err) {
            console.error("Error loading solicitud draft:", err);
          }
        }
      })();

      // -- Event Listeners --------------------------------------------------
      setupSillaPreviaConditionalField();
      setupJustificacionConditional();
      _setupEntidadValidation();
      _setupJustificacionValidation();

      // Anterior → tecnica.html
      document.getElementById("btn-anterior").addEventListener("click", () => {
        window.location.href = "tecnica.html";
      });

      // Guardar Borrador
      document.getElementById("btn-borrador").addEventListener("click", () => {
        submitGestion("borrador");
      });

      // Guardar datos de gestión (submit)
      document.querySelector("form").addEventListener("submit", (e) => {
        e.preventDefault();
        submitGestion("completo");
      });
    </script>

    <!-- Toast de éxito -->
    <div
      id="success-toast"
      class="success-toast fixed top-6 left-1/2 -translate-x-1/2 z-50 hidden flex items-center gap-3 rounded-xl bg-green-500 px-6 py-4 text-white shadow-2xl"
      role="status"
      aria-live="polite"
    >
      <div class="flex h-10 w-10 shrink-0 items-center justify-center rounded-full bg-white/20">
        <svg class="h-6 w-6" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
        </svg>
      </div>
      <span id="success-toast-msg" class="text-sm font-semibold">Guardado correctamente</span>
    </div>
  </body>
</html>
