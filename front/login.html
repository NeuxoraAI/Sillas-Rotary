<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Acceso | Ecosistema VIDA UG</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block" rel="stylesheet"/>
<script id="tailwind-config">
  tailwind.config = {
    darkMode: "class",
    theme: {
      extend: {
        colors: {
          "primary":          "#2B063D",
          "primary-bold":     "#3A0A4F",
          "ug-orange":        "#F15A24",
          "ug-orange-hover":  "#E84B10",
          "ug-orange-pure":   "#FF5A1F",
          "warm-bg":          "#FBF7F5",
        },
        fontFamily: { "display": ["Public Sans"] },
        borderRadius: { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "2xl": "1rem", "full": "9999px" },
      },
    },
  }
</script>
<link href="assets/css/theme.css" rel="stylesheet"/>
<script src="assets/js/common.js"></script>
<script src="assets/js/apiClient.js"></script>
<script src="assets/js/theme-toggle.js"></script>
<link href="assets/css/login.css" rel="stylesheet"/>
</head>
<body class="font-display min-h-screen flex flex-col bg-warm-bg overflow-x-hidden">

<!-- Header: Three logos with vertical separators -->
<header class="brand-header w-full bg-transparent px-4 md:px-6">
  <div class="max-w-[1500px] mx-auto flex items-center justify-center gap-0">
    <!-- Vida UG -->
    <div class="flex items-center justify-center overflow-hidden">
      <picture>
        <source srcset="assets/logo_vida_ug.webp" type="image/webp"/>
        <img alt="Ecosistema VIDA UG" class="logo-vida-ug object-contain" src="assets/logo_vida_ug.png"/>
      </picture>
    </div>

    <!-- Separator 1 -->
    <div class="hidden md:flex brand-separator mx-8 lg:mx-10" style="height:48px;"></div>

    <!-- Hope Haven -->
    <div class="flex items-center justify-center overflow-hidden">
      <picture>
        <source srcset="assets/logo_hope_haven_h.webp" type="image/webp"/>
        <img alt="Hope Haven" class="logo-hope-haven object-contain" src="assets/logo_hope_haven_h.png"/>
      </picture>
    </div>

    <!-- Separator 2 -->
    <div class="hidden md:flex brand-separator mx-8 lg:mx-10" style="height:48px;"></div>

    <!-- Rotary 200 -->
    <div class="flex items-center justify-center overflow-hidden">
      <img alt="Rotary 200" class="logo-rotary object-contain" src="assets/logo_rotary_wordmark.png"/>
    </div>
  </div>
</header>

<!-- Main: Login + Video with layered decorative waves -->
<main class="login-page flex-1 relative overflow-hidden">
  <!-- Decorative background: soft glows + connecting band + corner waves -->
  <div class="bg-glow-topleft" aria-hidden="true"></div>
  <div class="bg-glow-topright" aria-hidden="true"></div>

  <svg class="bg-arc-topright" aria-hidden="true" viewBox="0 0 700 260" fill="none" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="arc-grad" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%" stop-color="#FF5A1F" stop-opacity="0"/>
        <stop offset="55%" stop-color="#FF5A1F" stop-opacity="0.30"/>
        <stop offset="100%" stop-color="#FF5A1F" stop-opacity="0.55"/>
      </linearGradient>
    </defs>
    <path d="M40,10 C240,150 480,170 700,80" stroke="url(#arc-grad)" stroke-width="2" stroke-linecap="round"/>
    <path d="M120,0 C300,120 520,140 700,40" stroke="url(#arc-grad)" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
  </svg>

  <!-- Full-width soft band that visually connects both corner waves -->
  <svg class="wave-band" aria-hidden="true" viewBox="0 0 1600 280" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="band-grad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#F2B79E" stop-opacity="0"/>
        <stop offset="100%" stop-color="#F2B79E" stop-opacity="0.5"/>
      </linearGradient>
    </defs>
    <path d="M0,280 L0,150 C220,90 430,190 660,178 C920,164 1060,60 1290,96 C1420,117 1530,170 1600,150 L1600,280 Z" fill="url(#band-grad)"/>
  </svg>

  <!-- Bottom-left orange wave: back echo + gradient body + dots + white crest -->
  <svg class="wave-orange" aria-hidden="true" viewBox="0 0 560 420" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="orange-grad" x1="0.1" y1="0" x2="0.8" y2="1">
        <stop offset="0%" stop-color="#FF8A4D"/>
        <stop offset="50%" stop-color="#FF5A1F"/>
        <stop offset="100%" stop-color="#EF470D"/>
      </linearGradient>
      <pattern id="orange-dots" width="22" height="22" patternUnits="userSpaceOnUse">
        <circle cx="4" cy="4" r="1.3" fill="rgba(255,255,255,0.13)"/>
      </pattern>
    </defs>
    <path d="M0,420 L0,130 C80,78 145,140 220,158 C310,180 355,92 430,168 C500,240 532,330 560,408 L560,420 Z" fill="#FF5A1F" opacity="0.16"/>
    <path d="M0,420 L0,170 C70,120 130,180 200,196 C290,216 330,130 400,200 C470,272 510,350 560,420 Z" fill="url(#orange-grad)"/>
    <path d="M0,420 L0,170 C70,120 130,180 200,196 C290,216 330,130 400,200 C470,272 510,350 560,420 Z" fill="url(#orange-dots)"/>
    <path d="M0,150 C75,102 135,166 205,182 C295,202 338,118 408,188" stroke="rgba(255,255,255,0.45)" stroke-width="2" fill="none" stroke-linecap="round"/>
  </svg>

  <!-- Bottom-right purple wave: back echo + gradient body + orange crest -->
  <svg class="wave-purple" aria-hidden="true" viewBox="0 0 640 420" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="purple-grad" x1="0.2" y1="0" x2="0.85" y2="1">
        <stop offset="0%" stop-color="#4A1064"/>
        <stop offset="55%" stop-color="#2B063D"/>
        <stop offset="100%" stop-color="#1C0229"/>
      </linearGradient>
    </defs>
    <path d="M0,420 L0,400 C55,330 115,255 195,222 C285,186 355,210 425,168 C495,128 560,92 640,118 L640,420 Z" fill="#2B063D" opacity="0.14"/>
    <path d="M0,420 C60,350 120,280 200,248 C290,212 360,236 430,196 C500,156 560,120 640,150 L640,420 Z" fill="url(#purple-grad)"/>
    <path d="M0,400 C70,330 135,268 215,238 C305,204 372,226 442,186 C512,148 570,114 640,140" stroke="rgba(255,138,77,0.5)" stroke-width="2" fill="none" stroke-linecap="round"/>
  </svg>

  <div class="login-stage relative z-10 w-full mx-auto px-4 md:px-6">

    <!-- Left: Login card -->
    <div class="login-card flex flex-col items-center">

      <!-- Icon -->
      <div class="login-icon-wrap">
        <img src="assets/centrologin.jpg" alt="Accesibilidad con corazón" class="login-center-img"/>
      </div>

      <!-- Title -->
      <h1 class="login-title mb-1">Iniciar Sesión</h1>
      <p class="login-subtitle mb-2">Sistema Integral de Gestión Social y Técnica</p>

      <!-- Orange divider -->
      <div class="login-divider mb-6"></div>

      <!-- Form -->
      <form id="form-login" class="w-full space-y-5" novalidate>

        <!-- Email -->
        <div class="space-y-1.5">
          <label class="login-label block" for="email">Correo electrónico</label>
          <div class="relative">
            <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-ug-orange-pure text-xl pointer-events-none">mail</span>
            <input
              id="email" name="email" type="email" autocomplete="email"
              placeholder="usuario@ejemplo.com"
              class="login-input w-full pl-12 pr-4 text-slate-900 placeholder:text-slate-400"
            />
          </div>
        </div>

        <!-- Password -->
        <div class="space-y-1.5">
          <label class="login-label block" for="password">Contraseña</label>
          <div class="relative">
            <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-ug-orange-pure text-xl pointer-events-none">lock</span>
            <input
              id="password" name="password" type="password" autocomplete="current-password"
              placeholder="••••••••"
              class="login-input w-full pl-12 pr-12 text-slate-900 placeholder:text-slate-400"
            />
            <button type="button" id="toggle-pwd" class="absolute right-4 top-1/2 -translate-y-1/2 text-ug-orange-pure hover:text-ug-orange transition-colors" tabindex="-1" aria-label="Mostrar/ocultar contraseña">
              <span class="material-symbols-outlined text-xl" id="toggle-pwd-icon">visibility</span>
            </button>
          </div>
        </div>

        <!-- Error -->
        <p id="error-login" class="hidden text-red-600 text-sm text-center bg-red-50 border border-red-200 rounded-lg px-4 py-3" role="alert"></p>

        <!-- Submit -->
        <button
          id="btn-login" type="submit"
          class="login-btn group"
        >
          <span id="btn-text">INGRESAR AL SISTEMA</span>
          <span id="btn-icon" class="material-symbols-outlined text-xl ml-2 group-hover:translate-x-1 transition-transform">arrow_forward</span>
          <svg id="btn-spinner" class="hidden animate-spin h-5 w-5 text-white ml-2" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
          </svg>
        </button>

      </form>

      <!-- Security note -->
      <div class="mt-5 login-security-note">
        <span class="material-symbols-outlined">shield</span>
        <span>Acceso seguro con autenticación JWT</span>
      </div>

    </div>

    <!-- Right: Video -->
    <div class="login-video overflow-hidden flex flex-col">
      <div class="flex-1 flex items-center justify-center p-0">
        <div class="video-player w-full h-full relative overflow-hidden">
          <video
            autoplay loop muted playsinline preload="auto"
            disablepictureinpicture tabindex="-1" aria-hidden="true"
            poster="assets/logo_hope_haven_h.webp"
            class="w-full h-full object-cover pointer-events-none"
          >
            <source src="assets/video/VIDEOLOGIN.mp4" type="video/mp4"/>
            Tu navegador no soporta video HTML5.
          </video>
        </div>
      </div>
    </div>

  </div>

  <!-- Footer: positioned above waves, inside main for proper layering -->
  <footer class="login-footer w-full">
    <div class="py-4 px-6">
      <div class="max-w-5xl mx-auto flex flex-col sm:flex-row items-center justify-center gap-2">
        <div class="footer-neuxora flex items-center gap-1.5">
          <span class="material-symbols-outlined text-base" style="color:#777;">code</span>
          <span>Desarrollado por <strong>NEUXORA</strong> &middot; León, Gto.</span>
        </div>
        <span class="hidden sm:inline-block footer-separator"></span>
        <div class="footer-links flex items-center gap-1">
          <a href="#">Aviso de Privacidad</a>
          <span class="footer-separator"></span>
          <a href="https://andreraz.github.io/" target="_blank" rel="noopener noreferrer">Soporte Técnico</a>
        </div>
      </div>
    </div>
  </footer>

</main>

<script>
  // Redirect if already authenticated
  (function () {
    const session = _getSession();
    if (session?.token) _redirectByRole(session.rol);
  })();

  // Toggle password visibility
  document.getElementById('toggle-pwd').addEventListener('click', function () {
    const input = document.getElementById('password');
    const icon  = document.getElementById('toggle-pwd-icon');
    const show  = input.type === 'password';
    input.type  = show ? 'text' : 'password';
    icon.textContent = show ? 'visibility_off' : 'visibility';
  });

  // Form submit
  document.getElementById('form-login').addEventListener('submit', async function (e) {
    e.preventDefault();
    const email    = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const errorEl  = document.getElementById('error-login');

    _clearError(errorEl);

    if (!email || !password) {
      _showError(errorEl, 'Ingrese su correo y contraseña.');
      return;
    }

    _setLoading(true);

    try {
      const res = await ApiClient.fetch('/auth/login', {
        method:  'POST',
        auth:    false,
        json:    { email, password },
      });

      const data = await res.json().catch(() => ({}));

      if (!res.ok) {
        _showError(errorEl, data.detail || 'Credenciales inválidas. Verifique e intente de nuevo.');
        return;
      }

      // If a different user is logging in, clear role-specific context so the
      // new user never inherits stale data from a prior session.
      const _prevSession = _getSession();
      if (_prevSession && _prevSession.usuario_id !== data.usuario_id) {
        localStorage.removeItem('region_ctx');
        localStorage.removeItem('estudio_id');
        localStorage.removeItem('beneficiario_id');
        localStorage.removeItem('solicitud_id');
      }

      localStorage.setItem('session', JSON.stringify({
        token:      data.access_token,
        nombre:     data.nombre,
        rol:        data.rol,
        usuario_id: data.usuario_id,
      }));

      _redirectByRole(data.rol);

    } catch (_) {
      _showError(errorEl, 'No se pudo conectar con el servidor. Verifique su conexión.');
    } finally {
      _setLoading(false);
    }
  });

  // ── Helpers ──────────────────────────────────────────────────────────────

  function _redirectByRole(rol) {
    if (rol === 'admin') {
      window.location.href = 'admin-beneficiarios.html';
    } else if (rol === 'tecnico') {
      window.location.href = 'Tecnico-view/vista_tecnicos.html';
    } else if (rol === 'organizacion') {
      window.location.href = 'perfil-organizacion.html';
    } else if (rol === 'capturista') {
      window.location.href = 'Capturista-view/perfil-capturista.html';
    } else {
      window.location.href = 'Capturista-view/seleccion-region.html';
    }
  }

  function _showError(el, msg) {
    el.textContent = msg;
    el.classList.remove('hidden');
  }

  function _clearError(el) {
    el.textContent = '';
    el.classList.add('hidden');
  }

  function _setLoading(on) {
    const btn     = document.getElementById('btn-login');
    const txt     = document.getElementById('btn-text');
    const icon    = document.getElementById('btn-icon');
    const spinner = document.getElementById('btn-spinner');
    btn.disabled  = on;
    txt.textContent = on ? 'Verificando...' : 'INGRESAR AL SISTEMA';
    icon.classList.toggle('hidden', on);
    spinner.classList.toggle('hidden', !on);
  }
</script>
</body>
</html>
